<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet — RegenHub, LCA</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0;url=/intranet/board/">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    background: #0c0c0c;
    color: #c8c8c8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .wrap {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .org { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #888; margin-bottom: 28px; }
  .heading { font-size: 15px; color: #e8e0d8; margin-bottom: 12px; }
  .sub { font-size: 12px; color: #666; line-height: 1.6; margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    color: #c4956a;
    text-decoration: none;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    transition: border-color 0.15s, background 0.15s;
    min-width: 220px;
    justify-content: center;
  }
  .link-btn:hover { border-color: #c4956a; background: rgba(196,149,106,0.06); }
  .link-btn.primary { border-color: rgba(196,149,106,0.4); }
  .notice { margin-top: 40px; font-size: 11px; color: #444; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="org">RegenHub, LCA · Member Intranet</div>
  <div class="heading">This section is being reorganized.</div>
  <div class="sub">Active intranet pages are linked below.<br>You are being redirected to the Board interface.</div>
  <div class="links">
    <a class="link-btn primary" href="/intranet/board/">Board Interface →</a>
    <a class="link-btn" href="/intranet/treasury/">Treasury →</a>
    <a class="link-btn" href="/public/treasury/">Public Treasury →</a>
  </div>
  <div class="notice">
    If you are not redirected automatically, <a href="/intranet/board/" style="color:#888">click here</a>.
  </div>
</div>
</body>
</html>
