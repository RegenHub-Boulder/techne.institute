<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Enrollment — RegenHub, LCA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0f0f0f;
    --surface:      #1a1a1a;
    --surface-2:    #141414;
    --border:       #363636;
    --border-strong:#484848;
    --terra:        #c4956a;
    --terra-text:   #c4956a;
    --terra-dim:    rgba(196,149,106,0.12);
    --terra-glow:   rgba(196,149,106,0.05);
    --heading:      #e8e0d8;
    --text:         #d4d4d4;
    --muted:        #999;
    --faint:        #666;
    --very-faint:   #444;
    --green:        #6a8a5e;
    --rust:         #9a5a5a;
    --sky:          #5a7a9a;
  }
  [data-mode="light"] {
    --bg:           #faf7f2;
    --surface:      #f3ede4;
    --surface-2:    #efe8dc;
    --border:       #ccc4b8;
    --border-strong:#b8a898;
    --terra:        #c4956a;
    --terra-text:   #96704a;
    --terra-dim:    rgba(196,149,106,0.14);
    --terra-glow:   rgba(196,149,106,0.07);
    --heading:      #2d2620;
    --text:         #3d342b;
    --muted:        #6b5f53;
    --faint:        #968774;
    --very-faint:   #c4b69f;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 300ms ease, color 300ms ease;
  }

  /* ── Header ── */
  .hud-header {
    position: sticky; top: 0; z-index: 100;
    height: 56px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; gap: 18px;
    transition: background 300ms ease;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 26px; height: 26px;
    border: 1px solid var(--terra);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    color: var(--terra-text);
    font-family: 'Libre Baskerville', serif;
    font-style: italic; font-weight: 700; font-size: 13px;
    background: var(--terra-dim);
    text-decoration: none;
    flex-shrink: 0;
  }
  .back-link {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--terra-text); border-color: rgba(196,149,106,0.4); }
  .header-title {
    font-family: 'Libre Baskerville', serif; font-size: 13px;
    color: var(--heading); letter-spacing: -0.01em;
  }
  .mode-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; border: 1px solid var(--border-strong);
    color: var(--faint); border-radius: 4px;
    padding: 5px 10px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .mode-btn:hover { color: var(--terra-text); border-color: rgba(196,149,106,0.5); }

  /* ── Page shell ── */
  .page-shell { max-width: 740px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ── Progress rail ── */
  .progress-rail {
    display: flex; align-items: flex-start;
    gap: 0; margin-bottom: 32px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .rail-item {
    display: flex; flex-direction: column; align-items: center;
    flex: 1; min-width: 64px; position: relative; cursor: pointer;
  }
  .rail-item.future { cursor: default; }
  .rail-dot {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; z-index: 1; flex-shrink: 0;
    transition: all 0.2s;
  }
  .rail-dot.active  { background: var(--terra); color: #0a0a0a; box-shadow: 0 0 0 3px rgba(196,149,106,0.2); }
  .rail-dot.done    { background: var(--green); color: #fff; }
  .rail-dot.future  { background: rgba(255,255,255,0.07); color: var(--faint); border: 1px solid var(--border); }
  .rail-labels { display: flex; flex-direction: column; align-items: center; margin-top: 5px; gap: 1px; }
  .rail-phase { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); font-weight: 700; }
  .rail-phase.active { color: var(--terra-text); }
  .rail-phase.done   { color: var(--green); }
  .rail-name { font-size: 9px; color: var(--muted); text-align: center; }
  .rail-name.active { color: var(--text); }
  .rail-connector {
    position: absolute; top: 11px; left: 50%; right: -50%;
    height: 1px; background: var(--border); z-index: 0;
  }
  .rail-connector.done { background: var(--green); opacity: 0.4; }

  /* ── Save & exit bar ── */
  .exit-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 5px; padding: 8px 14px; margin-bottom: 20px;
  }
  .exit-bar-text { font-size: 10px; color: var(--faint); }
  .exit-bar-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: 1px solid var(--border-strong);
    color: var(--muted); border-radius: 4px; padding: 4px 10px;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .exit-bar-btn:hover { color: var(--terra-text); border-color: rgba(196,149,106,0.4); }

  /* ── Step card ── */
  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .step-head {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .step-icon {
    width: 36px; height: 36px; border-radius: 7px;
    background: var(--terra-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-icon svg { stroke: var(--terra-text); }
  .step-phase { font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--terra-text); font-weight: 700; margin-bottom: 3px; }
  .step-title { font-family: 'Libre Baskerville', serif; font-size: 16px; color: var(--heading); margin-bottom: 5px; }
  .step-desc { font-size: 11px; color: var(--muted); line-height: 1.6; max-width: 520px; }
  .step-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  .step-footer {
    display: flex; align-items: center;
    padding: 14px 24px; gap: 10px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .spacer { flex: 1; }

  /* ── Buttons ── */
  .btn-primary {
    background: var(--terra); border: none; color: #0a0a0a;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 500; padding: 8px 18px; border-radius: 5px;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }
  .btn-secondary {
    background: none; border: 1px solid var(--border-strong);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 5px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--border-strong); }

  /* ── Form elements ── */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .field-req { color: var(--rust); margin-left: 2px; }
  .field-hint { font-size: 10px; color: var(--faint); line-height: 1.55; }
  .field-opt { color: var(--faint); font-weight: 400; }
  input[type="text"], input[type="email"], textarea {
    background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 5px; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 8px 12px; outline: none; width: 100%;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
    border-color: rgba(196,149,106,0.5);
  }
  textarea { resize: vertical; line-height: 1.6; }

  /* ── Warning box ── */
  .warn-box {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px;
    background: rgba(154,90,90,0.08);
    border: 1px solid rgba(154,90,90,0.22);
    border-radius: 5px;
  }
  .warn-box svg { stroke: #9a5a5a; flex-shrink: 0; margin-top: 1px; }
  .warn-title { font-size: 10px; font-weight: 700; color: #9a5a5a; }
  .warn-body  { font-size: 10px; color: var(--muted); line-height: 1.55; }

  /* ── Doc links ── */
  .doc-links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .doc-link-primary {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--terra-dim); border: 1px solid rgba(196,149,106,0.28);
    border-radius: 5px; color: var(--terra-text);
    font-size: 10px; font-weight: 500; padding: 6px 12px;
    text-decoration: none; letter-spacing: 0.04em;
    transition: background 0.15s;
  }
  .doc-link-primary:hover { background: rgba(196,149,106,0.2); }
  .doc-link-sec {
    color: var(--muted); font-size: 10px; text-decoration: none;
    border-bottom: 1px solid var(--border); padding-bottom: 1px;
    transition: color 0.15s;
  }
  .doc-link-sec:hover { color: var(--terra-text); }
  .doc-meta { display: flex; gap: 20px; flex-wrap: wrap; }
  .doc-meta-item { font-size: 10px; color: var(--faint); }
  .doc-meta-item strong { color: var(--muted); }

  /* ── Read confirmation ── */
  .check-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border); border-radius: 5px;
  }
  .check-row input[type="checkbox"] { width: 14px; height: 14px; accentColor: var(--terra); cursor: pointer; flex-shrink: 0; }
  .check-row span { font-size: 11px; color: var(--text); }

  /* ── Vote options ── */
  .vote-grid { display: flex; flex-direction: column; gap: 7px; }
  .vote-option {
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; cursor: pointer;
    text-align: left; transition: border-color 0.15s, background 0.15s; width: 100%;
    font-family: 'IBM Plex Mono', monospace;
  }
  .vote-option:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .vote-option.selected-consent  { border-color: rgba(106,138,94,0.5);  background: rgba(106,138,94,0.07);  }
  .vote-option.selected-standAside{ border-color: rgba(196,149,106,0.5); background: rgba(196,149,106,0.07); }
  .vote-option.selected-object   { border-color: rgba(154,90,90,0.5);   background: rgba(154,90,90,0.07);   }
  .vote-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  .vote-indicator { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border-strong); flex-shrink: 0; }
  .vote-indicator.consent   { background: var(--green); border-color: var(--green); }
  .vote-indicator.standAside{ background: var(--terra);  border-color: var(--terra); }
  .vote-indicator.object    { background: var(--rust);   border-color: var(--rust);  }
  .vote-desc { font-size: 10px; color: var(--faint); line-height: 1.55; }

  /* ── Vote result notice ── */
  .vote-result {
    padding: 8px 12px; border-radius: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
  }
  .vote-result.consent  { background: rgba(106,138,94,0.1);  color: var(--green); border: 1px solid rgba(106,138,94,0.25); }
  .vote-result.standAside{background: rgba(196,149,106,0.1); color: var(--terra-text); border: 1px solid rgba(196,149,106,0.28); }
  .vote-result.object   { background: rgba(154,90,90,0.1);   color: var(--rust);  border: 1px solid rgba(154,90,90,0.25); }

  /* ── Orientation blocks ── */
  .orient-blocks { display: flex; flex-direction: column; gap: 14px; }
  .orient-block {
    padding: 14px 16px; border-radius: 6px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  }
  .orient-block h3 { font-family: 'Libre Baskerville', serif; font-size: 13px; color: var(--heading); margin-bottom: 6px; }
  .orient-block p  { font-size: 11px; color: var(--muted); line-height: 1.65; }
  .formula-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
  .formula-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .formula-pct { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .formula-lbl { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); font-weight: 700; }

  /* ── Complete screen ── */
  .complete-wrap {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 48px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .complete-mark {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(106,138,94,0.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .complete-title { font-family: 'Libre Baskerville', serif; font-size: 22px; color: var(--heading); margin-bottom: 10px; }
  .complete-desc  { font-size: 11.5px; color: var(--muted); max-width: 380px; line-height: 1.65; margin-bottom: 24px; }
  .vote-summary {
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 20px; width: 100%; max-width: 340px; margin-bottom: 16px; text-align: left;
  }
  .vote-summary-title { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin-bottom: 10px; font-weight: 700; }
  .vote-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .vote-summary-doc  { font-size: 10px; color: var(--muted); }
  .complete-note { font-size: 10px; color: var(--faint); max-width: 380px; line-height: 1.65; margin-bottom: 24px; }
  .complete-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* ── Error notice ── */
  .error-notice {
    padding: 8px 12px; border-radius: 5px; font-size: 10px;
    background: rgba(154,90,90,0.1); border: 1px solid rgba(154,90,90,0.25);
    color: var(--rust);
  }

  /* ── Quorum box ── */
  .quorum-box {
    display: inline-flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    border-radius: 7px; padding: 10px 18px; flex-shrink: 0;
  }
  .quorum-label { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin-bottom: 2px; }
  .quorum-val   { font-size: 22px; font-weight: 700; color: var(--terra-text); letter-spacing: -0.03em; line-height: 1; }
  .quorum-sub   { font-size: 8.5px; color: var(--faint); margin-top: 2px; text-align: center; }

  /* ── Page header ── */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--terra-text); font-weight: 700; margin-bottom: 5px; }
  .page-title { font-family: 'Libre Baskerville', serif; font-size: 22px; color: var(--heading); margin-bottom: 6px; letter-spacing: -0.01em; }
  .page-subtitle { font-size: 11px; color: var(--muted); line-height: 1.65; max-width: 460px; }

  @media (max-width: 600px) {
    .field-row { grid-template-columns: 1fr; }
    .page-shell { padding: 20px 16px 60px; }
    .step-body { padding: 16px; }
    .step-head { padding: 16px; }
    .step-footer { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="hud-header">
  <div class="header-left">
    <a href="/intranet/" class="brand-mark" title="Intranet home">τ</a>
    <a href="/intranet/" class="back-link">← Intranet</a>
    <span class="header-title">Enrollment</span>
  </div>
  <button class="mode-btn" id="modeBtn">Light</button>
</header>

<div class="page-shell">

  <!-- Page header -->
  <div class="page-header">
    <div>
      <p class="page-eyebrow">Board enrollment</p>
      <h1 class="page-title">Ratification &amp; enrollment</h1>
      <p class="page-subtitle">Read the governing documents, record advisory comments, and cast your ratification vote. This is the governance act.</p>
    </div>
    <div class="quorum-box">
      <span class="quorum-label">Quorum</span>
      <span class="quorum-val">5 / 8</span>
      <span class="quorum-sub">organizers required</span>
    </div>
  </div>

  <!-- Progress rail -->
  <div class="progress-rail" id="progressRail"></div>

  <!-- Exit bar -->
  <div class="exit-bar">
    <span class="exit-bar-text">Progress is saved automatically. You can return to this page at any time.</span>
    <button class="exit-bar-btn" onclick="window.location.href='/intranet/'">Save &amp; exit ↗</button>
  </div>

  <!-- Step container -->
  <div id="stepContainer"></div>

</div><!-- /page-shell -->

<script>
// ── State management ────────────────────────────────────────────────────────

const STORAGE_KEY = 'techne-enroll-v1';

const DEFAULT_STATE = {
  step: 0,
  name:         '',
  role:         '',
  location:     '',
  bio:          '',
  profileSaved: false,
  bylawsRead:     false,
  bylawsComment:  '',
  bylawsVote:     null,
  bylawsReason:   '',
  maRead:       false,
  maComment:    '',
  maVote:       null,
  maReason:     '',
  orientDone:   false,
  complete:     false,
  completedAt:  null,
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
  } catch (_) { return { ...DEFAULT_STATE }; }
}

function save(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (_) {}
}

let STATE = load();

// ── Step definitions ────────────────────────────────────────────────────────

const STEPS = [
  { id: 'identity',    label: 'Identity',        phase: 'Profile'     },
  { id: 'bylaws-read', label: 'Bylaws',           phase: 'Read'        },
  { id: 'bylaws-vote', label: 'Bylaws',           phase: 'Vote'        },
  { id: 'ma-read',     label: 'Mbr. Agreement',   phase: 'Read'        },
  { id: 'ma-vote',     label: 'Mbr. Agreement',   phase: 'Vote'        },
  { id: 'orientation', label: 'Capital Account',  phase: 'Orientation' },
  { id: 'complete',    label: 'Complete',         phase: ''            },
];

const DOCS = {
  bylaws: {
    title:   'Bylaws, Version 2',
    version: 'v.2',
    drafted: 'May 11, 2026',
    url:     '/legal/bylaws-v2/',
    analysisUrl: '/legal/bylaws-analysis/',
    blocking: 2,
    total:    8,
    desc:     'The foundational governance document. 18 articles covering member rights, board composition, voting procedures, and patronage distribution.',
  },
  ma: {
    title:   'Membership Agreement, Version 2',
    version: 'v.2',
    drafted: 'May 11, 2026',
    url:     '/legal/membership-agreement-v2/',
    analysisUrl: '/legal/membership-agreement-modifications/',
    blocking: 3,
    total:    6,
    desc:     'The agreement each Class A Patron Member signs. Governs obligations, IP, patronage rights, capital accounts, and withdrawal.',
  },
};

const VOTES = [
  { value: 'consent',   label: 'Consent',     color: 'var(--green)', cls: 'consent',   indCls: 'consent',
    desc: 'I can work with this document. It is good enough for now, safe enough to try.' },
  { value: 'standAside',label: 'Stand Aside', color: 'var(--terra-text)', cls: 'standAside', indCls: 'standAside',
    desc: 'I have reservations but will not block ratification. My concerns are on the record.' },
  { value: 'object',    label: 'Object',      color: 'var(--rust)', cls: 'object',    indCls: 'object',
    desc: 'I have a principled objection. This blocks ratification until resolved.' },
];

// ── SVG icons ───────────────────────────────────────────────────────────────

function iconSvg(d, size=20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
}

const ICONS = {
  person:  'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  doc:     'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 2v6h6M16 13H8M16 17H8',
  vote:    'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
  capital: 'M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
  done:    'M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3',
  warn:    'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
  ext:     'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3',
};
const STEP_ICONS = ['person','doc','vote','doc','vote','capital','done'];

// ── Render progress rail ────────────────────────────────────────────────────

function renderRail() {
  const rail = document.getElementById('progressRail');
  rail.innerHTML = STEPS.map((step, i) => {
    const done   = i < STATE.step;
    const active = i === STATE.step;
    const cls    = done ? 'done' : active ? 'active' : 'future';
    const connector = i < STEPS.length - 1
      ? `<div class="rail-connector${done ? ' done' : ''}"></div>` : '';
    return `
      <div class="rail-item${cls === 'future' ? ' future' : ''}" onclick="${i <= STATE.step ? `goToStep(${i})` : ''}" title="${step.label}${step.phase ? ' — ' + step.phase : ''}">
        <div class="rail-dot ${cls}">${done ? iconSvg('M20 6L9 17l-5-5', 10) : (i+1)}</div>
        <div class="rail-labels">
          <span class="rail-phase ${cls}">${step.phase}</span>
          <span class="rail-name ${cls}">${step.label}</span>
        </div>
        ${connector}
      </div>`;
  }).join('');
}

// ── Step renderers ──────────────────────────────────────────────────────────

function renderIdentity() {
  return `
    <div class="step-card">
      <div class="step-head">
        <div class="step-icon">${iconSvg(ICONS.person)}</div>
        <div>
          <p class="step-phase">Step 1 of 7</p>
          <h2 class="step-title">Your Identity</h2>
          <p class="step-desc">How you'll appear in the cooperative record. Name is required — other fields help the membership but aren't required to continue.</p>
        </div>
      </div>
      <div class="step-body">
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="f_name">Full name <span class="field-req">*</span></label>
            <input type="text" id="f_name" value="${esc(STATE.name)}" placeholder="Given and family name" autofocus>
          </div>
          <div class="field">
            <label class="field-label" for="f_role">Role / title <span class="field-opt">(optional)</span></label>
            <input type="text" id="f_role" value="${esc(STATE.role)}" placeholder="e.g. Ventures &amp; Operations Steward">
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="f_location">Location <span class="field-opt">(optional)</span></label>
          <input type="text" id="f_location" value="${esc(STATE.location)}" placeholder="e.g. Boulder, CO">
        </div>
        <div class="field">
          <label class="field-label" for="f_bio">Bio <span class="field-opt">(optional)</span></label>
          <textarea id="f_bio" rows="3" placeholder="A sentence or two about your work and practice…">${esc(STATE.bio)}</textarea>
        </div>
        <div id="identity_error"></div>
      </div>
      <div class="step-footer">
        <div class="spacer"></div>
        <button class="btn-primary" onclick="submitIdentity()">Continue →</button>
      </div>
    </div>`;
}

function renderDocRead(docKey, stepNum) {
  const doc = DOCS[docKey];
  const readKey   = docKey + 'Read';
  const commentKey= docKey + 'Comment';
  const isRead = STATE[readKey];
  return `
    <div class="step-card">
      <div class="step-head">
        <div class="step-icon">${iconSvg(ICONS.doc)}</div>
        <div>
          <p class="step-phase">Step ${stepNum} of 7</p>
          <h2 class="step-title">${doc.title}</h2>
          <p class="step-desc">${doc.desc}</p>
        </div>
      </div>
      <div class="step-body">
        ${doc.blocking > 0 ? `
        <div class="warn-box">
          ${iconSvg(ICONS.warn, 14)}
          <div>
            <span class="warn-title">${doc.blocking} blocking issue${doc.blocking !== 1 ? 's' : ''} identified</span>
            <span class="warn-body"> — ${doc.total} issues total. Ratification requires these to be resolved first.</span>
          </div>
        </div>` : ''}
        <div class="doc-links">
          <a class="doc-link-primary" href="${doc.url}" target="_blank" rel="noopener">
            ${iconSvg(ICONS.ext, 12)} Open document ↗
          </a>
          <a class="doc-link-sec" href="${doc.analysisUrl}" target="_blank" rel="noopener">View legal analysis (${doc.total} issues) ↗</a>
        </div>
        <div class="doc-meta">
          <span class="doc-meta-item">Version: <strong>${doc.version}</strong></span>
          <span class="doc-meta-item">Drafted: <strong>${doc.drafted}</strong></span>
          <span class="doc-meta-item">Status: <strong style="color:var(--terra-text)">Draft — not yet ratified</strong></span>
        </div>
        <div class="field">
          <label class="field-label" for="comment_${docKey}">Advisory comment <span class="field-opt">(optional)</span></label>
          <p class="field-hint">Your comment is advisory — it does not block ratification. Share questions, concerns, or suggested amendments for the record.</p>
          <textarea id="comment_${docKey}" rows="4" placeholder="Your observations, questions, or concerns about this document…">${esc(STATE[commentKey])}</textarea>
        </div>
        <label class="check-row" id="readCheck_${docKey}">
          <input type="checkbox" id="cb_${docKey}" ${isRead ? 'checked' : ''} onchange="updateCheckState('${docKey}')">
          <span>I have read this document and am ready to vote</span>
        </label>
      </div>
      <div class="step-footer">
        <button class="btn-secondary" onclick="goBack()">← Back</button>
        <div class="spacer"></div>
        <button class="btn-primary" id="readNext_${docKey}" ${isRead ? '' : 'disabled'} onclick="submitDocRead('${docKey}')">Continue →</button>
      </div>
    </div>`;
}

function renderDocVote(docKey, stepNum) {
  const doc = DOCS[docKey];
  const voteKey  = docKey + 'Vote';
  const reasonKey= docKey + 'Reason';
  const current  = STATE[voteKey];
  const needsReason = current === 'standAside' || current === 'object';
  const voteInfo = current ? VOTES.find(v => v.value === current) : null;

  return `
    <div class="step-card">
      <div class="step-head">
        <div class="step-icon">${iconSvg(ICONS.vote)}</div>
        <div>
          <p class="step-phase">Step ${stepNum} of 7</p>
          <h2 class="step-title">Vote — ${doc.title}</h2>
          <p class="step-desc">Full Consent model: Consent, Stand-aside, or Object. An unresolved Object blocks ratification. Quorum: 5 of 8 organizers.</p>
        </div>
      </div>
      <div class="step-body">
        <div class="vote-grid">
          ${VOTES.map(v => `
            <button class="vote-option${current === v.value ? ' selected-'+v.cls : ''}" onclick="selectVote('${docKey}', '${v.value}')">
              <div class="vote-label">
                <span class="vote-indicator${current === v.value ? ' '+v.indCls : ''}"></span>
                <span style="color:${current === v.value ? v.color : 'var(--text)'}">${v.label}</span>
              </div>
              <p class="vote-desc">${v.desc}</p>
            </button>`).join('')}
        </div>
        ${needsReason ? `
        <div class="field" id="reasonField_${docKey}">
          <label class="field-label" for="reason_${docKey}">
            ${current === 'object' ? 'Objection' : 'Reservation'} <span class="field-req">*</span>
          </label>
          <p class="field-hint">${current === 'object'
            ? 'State your principled objection clearly. What specific harm does this document cause? What would need to change?'
            : 'Note your reservation for the record. This does not block ratification.'}</p>
          <textarea id="reason_${docKey}" rows="4" placeholder="${current === 'object' ? 'My objection is…' : 'My reservation is…'}">${esc(STATE[reasonKey])}</textarea>
        </div>` : ''}
        ${current ? `<div class="vote-result ${voteInfo.cls}">Your vote: ${voteInfo.label}</div>` : ''}
      </div>
      <div class="step-footer">
        <button class="btn-secondary" onclick="goBack()">← Back</button>
        <div class="spacer"></div>
        <button class="btn-primary" id="voteNext_${docKey}"
          ${(!current || (needsReason && !STATE[reasonKey])) ? 'disabled' : ''}
          onclick="submitDocVote('${docKey}')">Continue →</button>
      </div>
    </div>`;
}

function renderOrientation() {
  return `
    <div class="step-card">
      <div class="step-head">
        <div class="step-icon">${iconSvg(ICONS.capital)}</div>
        <div>
          <p class="step-phase">Step 6 of 7</p>
          <h2 class="step-title">Capital Account</h2>
          <p class="step-desc">A brief orientation to how your economic stake in the cooperative is tracked.</p>
        </div>
      </div>
      <div class="step-body">
        <div class="orient-blocks">
          <div class="orient-block">
            <h3>What is a capital account?</h3>
            <p>Every cooperative member holds a capital account — a running record of your economic stake. It accumulates as you contribute labor, generate revenue, or invest cash, and decrements as the cooperative distributes patronage back to you.</p>
          </div>
          <div class="orient-block">
            <h3>IRC § 704(b) — Partnership Tax Treatment</h3>
            <p>RegenHub elected Subchapter K partnership tax treatment. Under IRC § 704(b), your capital account is the governing record of your economic rights. This gives the cooperative flexibility to recognize multiple forms of contribution and allocate surplus with precision.</p>
          </div>
          <div class="orient-block">
            <h3>Patronage formula (proposed, not yet ratified)</h3>
            <div class="formula-row">
              <div class="formula-item"><span class="formula-pct" style="color:var(--terra-text)">40%</span><span class="formula-lbl">Labor</span></div>
              <div class="formula-item"><span class="formula-pct" style="color:var(--green)">30%</span><span class="formula-lbl">Revenue</span></div>
              <div class="formula-item"><span class="formula-pct" style="color:var(--sky)">20%</span><span class="formula-lbl">Capital</span></div>
              <div class="formula-item"><span class="formula-pct" style="color:var(--faint)">10%</span><span class="formula-lbl">Community</span></div>
            </div>
          </div>
          <div class="orient-block">
            <h3>Cloud Credits</h3>
            <p>1 CLOUD ≈ $0.10. Cloud credits are the cooperative's unit of exchange for compute. They appear in your capital account as a resource balance.</p>
          </div>
        </div>
      </div>
      <div class="step-footer">
        <button class="btn-secondary" onclick="goBack()">← Back</button>
        <div class="spacer"></div>
        <button class="btn-primary" onclick="submitOrientation()">Complete enrollment →</button>
      </div>
    </div>`;
}

function renderComplete() {
  const bVote = VOTES.find(v => v.value === STATE.bylawsVote);
  const mVote = VOTES.find(v => v.value === STATE.maVote);
  return `
    <div class="complete-wrap">
      <div class="complete-mark">${iconSvg(ICONS.done, 26)}</div>
      <h2 class="complete-title">Enrollment complete</h2>
      <p class="complete-desc">Your profile is set, your votes are on record, and your capital account orientation is done. Welcome to the cooperative.</p>
      <div class="vote-summary">
        <p class="vote-summary-title">Your votes</p>
        <div class="vote-summary-row">
          <span class="vote-summary-doc">Bylaws v.2</span>
          <span style="color:${bVote?.color || 'var(--faint)'};font-weight:700;font-size:10px;">${bVote?.label || 'Not voted'}</span>
        </div>
        <div class="vote-summary-row" style="border:none;">
          <span class="vote-summary-doc">Membership Agreement v.2</span>
          <span style="color:${mVote?.color || 'var(--faint)'};font-weight:700;font-size:10px;">${mVote?.label || 'Not voted'}</span>
        </div>
      </div>
      <p class="complete-note">Ratification requires 5 of 8 organizers to consent with zero unresolved objects. Vote tally will be visible in Agreements once tallying is active.</p>
      <div class="complete-actions">
        <button class="btn-primary" onclick="window.location.href='/intranet/'">Go to intranet →</button>
        <button class="btn-secondary" onclick="window.location.href='/intranet/agreements/'">View agreements</button>
      </div>
    </div>`;
}

// ── Render current step ─────────────────────────────────────────────────────

function render() {
  renderRail();
  const el = document.getElementById('stepContainer');
  const step = STATE.step;
  const complete = document.getElementById('progressRail').parentNode.querySelector('.exit-bar');

  if (step >= 6 || STATE.complete) {
    if (complete) complete.style.display = 'none';
    document.getElementById('progressRail').style.display = 'none';
    el.innerHTML = renderComplete();
    return;
  }

  if (complete) complete.style.display = '';
  document.getElementById('progressRail').style.display = '';

  if      (step === 0) el.innerHTML = renderIdentity();
  else if (step === 1) el.innerHTML = renderDocRead('bylaws', 2);
  else if (step === 2) el.innerHTML = renderDocVote('bylaws', 3);
  else if (step === 3) el.innerHTML = renderDocRead('ma', 4);
  else if (step === 4) el.innerHTML = renderDocVote('ma', 5);
  else if (step === 5) el.innerHTML = renderOrientation();
  else                 el.innerHTML = renderComplete();
}

// ── Helpers ─────────────────────────────────────────────────────────────────

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function goBack() {
  STATE.step = Math.max(0, STATE.step - 1);
  save(STATE);
  render();
}

function goToStep(i) {
  if (i > STATE.step) return;
  STATE.step = i;
  save(STATE);
  render();
}

function goNext() {
  STATE.step = Math.min(STATE.step + 1, STEPS.length - 1);
  save(STATE);
  render();
}

// ── Step submit handlers ────────────────────────────────────────────────────

function submitIdentity() {
  const name = document.getElementById('f_name')?.value?.trim();
  if (!name) {
    document.getElementById('identity_error').innerHTML =
      '<div class="error-notice">Full name is required.</div>';
    return;
  }
  STATE.name         = name;
  STATE.role         = document.getElementById('f_role')?.value?.trim() || '';
  STATE.location     = document.getElementById('f_location')?.value?.trim() || '';
  STATE.bio          = document.getElementById('f_bio')?.value?.trim() || '';
  STATE.profileSaved = true;
  save(STATE);
  goNext();
}

function updateCheckState(docKey) {
  const cb = document.getElementById('cb_' + docKey);
  const btn = document.getElementById('readNext_' + docKey);
  STATE[docKey + 'Read'] = cb.checked;
  save(STATE);
  if (btn) btn.disabled = !cb.checked;
}

function submitDocRead(docKey) {
  const comment = document.getElementById('comment_' + docKey)?.value?.trim() || '';
  STATE[docKey + 'Comment'] = comment;
  STATE[docKey + 'Read']    = true;
  save(STATE);
  goNext();
}

function selectVote(docKey, value) {
  STATE[docKey + 'Vote'] = value;
  save(STATE);
  render();
  // Scroll reason field into view if it appears
  setTimeout(() => {
    const rf = document.getElementById('reasonField_' + docKey);
    if (rf) rf.querySelector('textarea')?.focus();
  }, 50);
}

function submitDocVote(docKey) {
  const reasonEl = document.getElementById('reason_' + docKey);
  const reason   = reasonEl?.value?.trim() || '';
  const vote     = STATE[docKey + 'Vote'];
  const needsReason = vote === 'standAside' || vote === 'object';

  if (needsReason && !reason) {
    if (reasonEl) reasonEl.style.borderColor = 'rgba(154,90,90,0.6)';
    return;
  }

  STATE[docKey + 'Reason'] = reason;
  save(STATE);
  goNext();
}

function submitOrientation() {
  STATE.orientDone = true;
  STATE.complete   = true;
  STATE.completedAt= new Date().toISOString();
  save(STATE);
  render();
}

// ── Reason textarea live validation ─────────────────────────────────────────

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (!id.startsWith('reason_')) return;
  const docKey = id.replace('reason_', '');
  const reason = e.target.value.trim();
  STATE[docKey + 'Reason'] = e.target.value;
  save(STATE);
  const btn = document.getElementById('voteNext_' + docKey);
  if (btn) btn.disabled = !reason;
});

// ── Theme toggle ─────────────────────────────────────────────────────────────

const root = document.documentElement;
const modeBtn = document.getElementById('modeBtn');
const stored = localStorage.getItem('cis-theme');
if (stored) root.setAttribute('data-mode', stored);
modeBtn.textContent = root.getAttribute('data-mode') === 'dark' ? 'Light' : 'Dark';
modeBtn.addEventListener('click', () => {
  const next = root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-mode', next);
  localStorage.setItem('cis-theme', next);
  modeBtn.textContent = next === 'dark' ? 'Light' : 'Dark';
});

// ── Init ─────────────────────────────────────────────────────────────────────

render();
</script>
</body>
</html>
