<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function() {
      var s = localStorage.getItem('techne-theme');
      if (s === 'light' || s === 'dark') {
        document.documentElement.setAttribute('data-theme', s);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techne Cooperative — Articulation (plain text)</title>
  <meta name="description" content="Plain-text version of the Techne Cooperative articulation for copying into Google Docs or other collaborative editors.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://techne.institute/articulation/plain/">
  <link rel="stylesheet" href="/assets/tokens.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400&display=swap');

    :root {
      --bg: var(--parchment, #f7f5f0);
      --bg-alt: var(--cream, #ebe7df);
      --text-primary: var(--charcoal, #1a1a1f);
      --text-body: #3a3530;
      --text-dim: var(--stone, #9a958a);
      --accent: var(--ember, #c4956a);
      --accent-glow: rgba(196, 149, 106, 0.08);
      --rule: var(--bone, #d8d3c8);
    }

    [data-theme="dark"] {
      --bg: var(--parchment, #0f0f12);
      --bg-alt: var(--cream, #141418);
      --text-primary: var(--charcoal, #e8e4df);
      --text-body: #c8c2ba;
      --text-dim: #9a958a;
      --rule: var(--bone, #2a2a30);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 17px; scroll-behavior: smooth; background: var(--bg); }
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      color: var(--text-body);
      line-height: 1.7;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 2rem 6rem;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Toolbar ─── */
    .toolbar {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      padding: 1rem 0;
      margin: -1.5rem -2rem 2rem;
      padding-left: 2rem;
      padding-right: 2rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .toolbar .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .toolbar button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 3px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: opacity 150ms;
    }
    .toolbar button:hover { opacity: 0.85; }
    .toolbar button:disabled { opacity: 0.5; cursor: default; }
    .toolbar button.success { background: #6a9a6a; }
    .toolbar .toolbar-link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 150ms, border-color 150ms;
    }
    .toolbar .toolbar-link:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .toolbar .spacer { flex: 1; }

    /* ─── Content ─── */
    #content { padding-top: 1rem; }

    h1 {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 2.5rem;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.2;
      margin: 0 0 1rem;
    }
    h2 {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.25;
      margin: 3.5rem 0 1rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    h2:first-of-type { border-top: none; padding-top: 0; }
    h3 {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text-primary);
      margin: 2rem 0 0.6rem;
    }

    p { margin-bottom: 1rem; color: var(--text-body); }
    p em { color: var(--text-primary); }
    strong { font-weight: 600; color: var(--text-primary); }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    ul, ol {
      margin: 0.5rem 0 1.25rem 1.75rem;
      line-height: 1.75;
    }
    li { margin-bottom: 0.4rem; color: var(--text-body); }
    li strong { color: var(--text-primary); }

    blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 0 0.5rem 1.5rem;
      margin: 1.5rem 0;
      background: var(--accent-glow);
      font-style: italic;
      color: var(--text-body);
    }
    blockquote p:last-child { margin-bottom: 0; }

    hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 3rem 0;
    }

    code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      background: var(--accent-glow);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    /* ─── States ─── */
    .loading, .error {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
      padding: 3rem 0;
      text-align: center;
    }
    .error { color: #c46a6a; }

    /* ─── Mobile ─── */
    @media (max-width: 640px) {
      body { padding: 1rem 1.25rem 4rem; }
      .toolbar {
        margin: -1rem -1.25rem 1.5rem;
        padding: 0.75rem 1.25rem;
        gap: 0.75rem;
      }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.4rem; margin: 2.5rem 0 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="label">Plain · for Google Docs</span>
    <button type="button" id="copyBtn">Copy formatted text</button>
    <button type="button" id="copyMdBtn">Copy raw markdown</button>
    <span class="spacer"></span>
    <a class="toolbar-link" href="/articulation/">Long</a>
    <a class="toolbar-link" href="/articulation/short/">Short</a>
  </div>

  <div id="content"><p class="loading">Loading articulation…</p></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    (function() {
      var contentEl = document.getElementById('content');
      var copyBtn = document.getElementById('copyBtn');
      var copyMdBtn = document.getElementById('copyMdBtn');
      var rawMarkdown = '';

      // Configure marked for clean output
      if (typeof marked !== 'undefined') {
        marked.setOptions({ gfm: true, breaks: false });
      }

      fetch('/articulation/articulation.md', { cache: 'no-cache' })
        .then(function(r) {
          if (!r.ok) throw new Error('Failed to load: ' + r.status);
          return r.text();
        })
        .then(function(md) {
          rawMarkdown = md;
          if (typeof marked === 'undefined') {
            contentEl.innerHTML = '<p class="error">Markdown renderer failed to load. <a href="/articulation/articulation.md">View raw markdown</a>.</p>';
            return;
          }
          contentEl.innerHTML = marked.parse(md);
        })
        .catch(function(err) {
          contentEl.innerHTML = '<p class="error">Couldn\'t load the articulation: ' + err.message + '. <a href="/articulation/articulation.md">View raw markdown</a>.</p>';
        });

      function flashSuccess(btn, msg) {
        var original = btn.textContent;
        btn.textContent = msg || 'Copied!';
        btn.classList.add('success');
        btn.disabled = true;
        setTimeout(function() {
          btn.textContent = original;
          btn.classList.remove('success');
          btn.disabled = false;
        }, 1800);
      }

      function flashError(btn, msg) {
        var original = btn.textContent;
        btn.textContent = msg || 'Copy failed';
        setTimeout(function() {
          btn.textContent = original;
        }, 2200);
      }

      // Copy as formatted text (HTML + plain fallback)
      copyBtn.addEventListener('click', async function() {
        try {
          var html = contentEl.innerHTML;
          var text = contentEl.innerText;

          if (navigator.clipboard && window.ClipboardItem) {
            var blob = new Blob([html], { type: 'text/html' });
            var textBlob = new Blob([text], { type: 'text/plain' });
            await navigator.clipboard.write([
              new ClipboardItem({
                'text/html': blob,
                'text/plain': textBlob
              })
            ]);
            flashSuccess(copyBtn, 'Copied · paste into Google Docs');
          } else if (navigator.clipboard && navigator.clipboard.writeText) {
            // Fallback to plain text
            await navigator.clipboard.writeText(text);
            flashSuccess(copyBtn, 'Copied (plain text)');
          } else {
            // Older browsers: select and copy via execCommand
            var range = document.createRange();
            range.selectNode(contentEl);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            var ok = document.execCommand('copy');
            sel.removeAllRanges();
            if (ok) flashSuccess(copyBtn); else flashError(copyBtn);
          }
        } catch (e) {
          console.error(e);
          flashError(copyBtn);
        }
      });

      // Copy raw markdown
      copyMdBtn.addEventListener('click', async function() {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(rawMarkdown);
            flashSuccess(copyMdBtn, 'Markdown copied');
          } else {
            flashError(copyMdBtn);
          }
        } catch (e) {
          console.error(e);
          flashError(copyMdBtn);
        }
      });
    })();
  </script>
</body>
</html>
